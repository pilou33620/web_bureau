name: verrou des dépendances

# Le Pi n'a pas cargo : ce travail, lancé à la main (gh workflow run verrou.yml), refait Cargo.lock
# avec les dernières versions compatibles et le rend en artefact, à télécharger (gh run download),
# relire et committer. Les autres travaux compilent avec --locked : rien ne change sans ce geste.
on:
  workflow_dispatch:

jobs:
  verrou:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo update
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
